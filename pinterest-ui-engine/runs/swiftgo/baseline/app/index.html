<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwiftGo — Send and track parcels</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div data-view="home">
  <header class="hdr">
    <div class="hdr-in">
      <div class="logo">SwiftGo</div>
      <div class="loc">Bengaluru</div>
    </div>
  </header>
  <main class="main">
    <section class="hero">
      <h1>Your packages, our priority.</h1>
      <p>Send a parcel, or track one you have already sent.</p>
      <div class="track">
        <input id="track-input" data-testid="track-input" type="search" placeholder="Tracking reference">
        <button class="btn-primary" data-testid="track-btn">Track</button>
      </div>
      <p class="err" data-testid="track-error" hidden></p>
      <button class="btn-primary wide" data-testid="send-open">Send a parcel</button>
    </section>

    <div id="active"></div>

    <h2 class="h2">Recent shipments</h2>
    <div class="list" id="recent"></div>
  </main>
</div>

<div data-view="detail" hidden>
  <header class="sub"><button class="back" data-testid="back-btn">← Back</button></header>
  <main class="main" id="detail-content"></main>
</div>

<div data-view="send" hidden>
  <header class="sub"><button class="back" data-nav="home">← Back</button><span class="sub-t">Send a parcel</span></header>
  <main class="main">
    <h2 class="h2">What are you sending?</h2>
    <div class="pkgs" id="pkg-grid"></div>

    <h2 class="h2">How heavy is it?</h2>
    <div class="stepper">
      <button data-testid="weight-minus">-</button>
      <span data-testid="weight-value">1.5 kg</span>
      <button data-testid="weight-plus">+</button>
    </div>

    <h2 class="h2">Pickup &amp; drop</h2>
    <label class="fld"><span>Pickup address</span><input id="pickup" data-testid="pickup" placeholder="Home · Indiranagar"></label>
    <label class="fld"><span>Drop address</span><input id="drop" data-testid="drop" placeholder="Where is it going?"></label>
    <p class="err" data-testid="error-drop" hidden></p>
    <label class="fld"><span>Receiver phone</span><input id="phone" data-testid="phone" placeholder="10-digit mobile"></label>
    <p class="err" data-testid="error-phone" hidden></p>

    <h2 class="h2">How fast?</h2>
    <div class="svcs" id="svc-row"></div>

    <button class="btn-primary wide" data-testid="send-submit">Pay <span data-testid="quote-total">—</span></button>
  </main>
</div>

<div data-view="confirmation" hidden>
  <main class="main confirm" id="confirm-content"></main>
</div>

<div data-view="shipments" hidden>
  <header class="sub"><button class="back" data-nav="home">← Back</button><span class="sub-t">My shipments</span></header>
  <main class="main" id="shipments-content"></main>
</div>

<nav class="tabs">
  <button class="tab on" data-nav="home">Home</button>
  <button class="tab" data-nav="shipments" data-testid="shipments-open">Shipments</button>
  <button class="tab" data-nav="send">Send</button>
</nav>
